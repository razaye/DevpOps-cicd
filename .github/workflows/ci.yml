name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      -  uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest test_app.py -v
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
  
      - name: Login Docker Hub
        run: echo "${{secrets Docker_PASSWORD}}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-std

      - name: Build et push image
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME }}/flask-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest

      - name: Déployer sur AWS
        run: |
          echo "${{ secrets.AWS_SSH_KEY}}" > deploy_key.pem
          chmod 400 deploy_key.pem
          ssh -o StrictHostkeyChecking=no -i deploy_key.pem ubuntu@${{ secrets.AWS_HOST }} " sudo docker pull ${{ secrets.DOCKER_USERNAME }}/flask-app:latest && sudo docker stop mon-flask || true && sudo docker rm mon-flask || true && sudo docker run -d -p 80:5000 --name mon-flask ${{ secrets.DOCKER_USERNAME }}/flask-app:latest "
